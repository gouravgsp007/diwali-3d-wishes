<!DOCTYPE html>
<html lang="en" class="w-full h-full overflow-hidden select-none bg-[#0d0208] text-amber-100 font-sans overscroll-none touch-none">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Shubh Deepavali ✨ 3D Interactive Wishes</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="w-full h-full overflow-hidden select-none bg-[#0d0208] text-amber-100 font-sans overscroll-none touch-none">
    <div
      id="app"
      class="fixed inset-0 w-screen h-[100svh] overflow-hidden flex flex-col items-center justify-center p-4 overscroll-none touch-manipulation"
    >
      <!-- Atmospheric nocturnal Diwali background gradient -->
      <div
        class="absolute inset-0 bg-gradient-to-b from-[#0d0208] via-[#1a0614] to-[#080105] pointer-events-none -z-10"
      ></div>

      <!-- Glassmorphic Passcode Card Modal -->
      <div
        id="passcode-card"
        class="w-full max-w-sm rounded-3xl p-6 bg-white/[0.04] backdrop-blur-xl border border-amber-500/20 shadow-2xl shadow-amber-950/40 text-center transition-all duration-300"
      >
        <div class="text-3xl mb-2 select-none">🪔</div>
        <p class="text-xs font-semibold tracking-widest uppercase text-amber-400/80 mb-1">
          ✨ Shubh Deepavali ✨
        </p>
        <h1 class="text-xl font-bold text-amber-100 mb-2">Unlock Your Diwali Surprise</h1>
        <p class="text-xs text-amber-200/70 mb-6 leading-relaxed">
          Enter the secret passcode sent by your loved one
        </p>

        <form id="passcode-form" class="space-y-4">
          <div>
            <input
              id="passcode-input"
              type="text"
              inputmode="text"
              maxlength="6"
              minlength="4"
              required
              pattern="[A-Za-z0-9]{4,6}"
              placeholder="e.g. PRIYA"
              autocomplete="off"
              autocapitalize="characters"
              spellcheck="false"
              class="w-full text-center tracking-[0.3em] font-mono font-bold text-2xl py-3 px-4 rounded-xl bg-black/40 border border-amber-500/30 text-amber-200 placeholder:text-amber-500/30 focus:outline-none focus:border-amber-400 focus:ring-2 focus:ring-amber-400/40 transition-all uppercase"
            />
          </div>

          <button
            id="unlock-btn"
            type="submit"
            class="w-full py-3.5 px-6 rounded-xl font-semibold text-sm tracking-wider uppercase bg-gradient-to-r from-amber-500 via-amber-400 to-amber-600 text-amber-950 shadow-lg shadow-amber-500/20 active:scale-[0.98] transition-all cursor-pointer"
          >
            Open Festive Wish 🪔
          </button>

          <p
            id="error-feedback"
            class="hidden mt-4 text-xs font-medium text-rose-400/90 leading-tight"
          ></p>
        </form>

        <button
          id="create-wish-btn"
          type="button"
          class="mt-4 inline-block text-xs font-medium text-amber-400/80 hover:text-amber-300 underline underline-offset-4 transition-colors cursor-pointer"
        >
          Create Your Own Wish ✨
        </button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
