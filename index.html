<!DOCTYPE html>
<html lang="en" class="w-full h-full overflow-hidden select-none bg-[#0d0208] text-amber-100 font-sans overscroll-none touch-none">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Shubh Deepavali ✨ 3D Interactive Wishes</title>
    <meta name="description" content="Light a sacred ceremonial 3D Diwali Diya and unlock a personalized festive greeting." />
    <meta property="og:title" content="Shubh Deepavali ✨ 3D Interactive Wishes" />
    <meta property="og:description" content="A special personalized 3D Diwali surprise is waiting for you. Light your Diya to unlock your wish!" />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0d0208" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="w-full h-full overflow-hidden select-none bg-[#0d0208] text-amber-100 font-sans overscroll-none touch-none">
    <div
      id="app"
      class="fixed inset-0 w-screen h-[100svh] overflow-hidden flex flex-col items-center justify-center p-4 overscroll-none touch-none"
    >
      <!-- Atmospheric nocturnal Diwali background gradient -->
      <div
        class="absolute inset-0 bg-gradient-to-b from-[#0d0208] via-[#1a0614] to-[#080105] pointer-events-none -z-10"
      ></div>

      <!-- Top Festive Bar with Auspicious Header & Fireworks Trigger -->
      <header
        class="fixed top-0 left-0 right-0 z-30 flex items-center justify-between px-4 sm:px-6 py-3 bg-black/40 backdrop-blur-md border-b border-amber-500/20 text-xs sm:text-sm text-amber-200 select-none"
      >
        <div class="flex items-center gap-2">
          <span class="text-lg">🪔</span>
          <span class="font-serif font-bold tracking-wider text-amber-300">SHUBH DEEPAVALI</span>
          <span class="hidden sm:inline text-amber-400/60 font-sans text-xs">• शुभ दीपावली</span>
        </div>
        <div class="flex items-center gap-2">
          <a
            href="#create"
            class="px-3 py-1.5 rounded-full bg-gradient-to-r from-amber-500/20 to-amber-600/30 hover:from-amber-500/30 hover:to-amber-600/40 active:scale-95 border border-amber-400/40 text-amber-200 text-xs font-semibold tracking-wide transition-all no-underline flex items-center gap-1 shadow-md cursor-pointer"
          >
            <span>✨</span>
            <span>Create Wish</span>
          </a>
          <button
            id="header-fireworks-btn"
            type="button"
            class="px-3 py-1.5 rounded-full bg-amber-500/15 hover:bg-amber-500/25 active:scale-95 border border-amber-400/30 text-amber-200 text-xs font-semibold tracking-wide transition-all cursor-pointer pointer-events-auto flex items-center gap-1 shadow-md"
            title="Burst golden Diwali fireworks"
          >
            <span>🎆</span>
            <span>Fireworks</span>
          </button>
        </div>
      </header>

      <!-- Glassmorphic Passcode Card Modal -->
      <div
        id="passcode-card"
        class="w-full max-w-sm rounded-3xl p-6 bg-white/[0.04] backdrop-blur-xl border border-amber-500/20 shadow-2xl shadow-amber-950/40 text-center transition-all duration-300 relative z-20 pointer-events-auto"
      >
        <div class="text-3xl mb-2 select-none">🪔</div>
        <p class="text-xs font-semibold tracking-widest uppercase text-amber-400/80 mb-1">
          ✨ Shubh Deepavali ✨
        </p>
        <h1 class="text-xl font-bold text-amber-100 mb-2">Unlock Your Diwali Surprise</h1>
        <p class="text-xs text-amber-200/70 mb-5 leading-relaxed">
          Enter the secret passcode sent by your loved one
        </p>

        <form id="passcode-form" class="space-y-3">
          <div>
            <input
              id="passcode-input"
              type="text"
              inputmode="text"
              maxlength="6"
              minlength="4"
              required
              pattern="[A-Za-z0-9]{4,6}"
              placeholder="ENTER PASSCODE"
              autocomplete="off"
              autocapitalize="characters"
              spellcheck="false"
              class="w-full text-center tracking-[0.3em] font-mono font-bold text-2xl py-3 px-4 rounded-xl bg-black/40 border border-amber-500/30 text-amber-200 placeholder:text-amber-500/30 focus:outline-none focus:border-amber-400 focus:ring-2 focus:ring-amber-400/40 transition-all uppercase pointer-events-auto cursor-text"
            />
          </div>

          <button
            id="unlock-btn"
            type="submit"
            class="w-full py-3.5 px-6 rounded-xl font-semibold text-sm tracking-wider uppercase bg-gradient-to-r from-amber-500 via-amber-400 to-amber-600 text-amber-950 shadow-lg shadow-amber-500/20 active:scale-[0.98] transition-all cursor-pointer"
          >
            Open Festive Wish 🪔
          </button>

          <p
            id="error-feedback"
            class="hidden mt-2 text-xs font-medium text-rose-400/90 leading-tight"
          ></p>
        </form>

        <div class="mt-4 pt-3 border-t border-amber-500/15 flex flex-col gap-2 items-center">
          <button
            id="create-wish-btn"
            type="button"
            class="w-full py-2.5 px-4 rounded-xl text-xs font-semibold tracking-wider uppercase bg-amber-500/10 hover:bg-amber-500/20 active:scale-[0.98] border border-amber-400/30 text-amber-300 transition-all flex items-center justify-center gap-1.5 cursor-pointer"
          >
            <span>✨ Create a Custom Wish</span>
            <span>🪔</span>
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
